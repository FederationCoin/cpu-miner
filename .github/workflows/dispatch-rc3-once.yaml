# One-shot. Inert after this commit.
name: Dispatch rc3 once

on:
  push:
    branches:
      - get-to-mainnet

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: startsWith(github.event.head_commit.message, 'Dispatch Package rc3 after CUDA headers fix.')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/disp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/FederationCoin/cpu-miner/actions/workflows/package.yaml/dispatches \
            --data-binary '{"ref":"v0.1.0-federationcoin.0.rc3","inputs":{"tag":"v0.1.0-federationcoin.0.rc3"}}')
          echo "dispatch http ${code}"
          cat /tmp/disp.json || true
          test "${code}" = "204"
