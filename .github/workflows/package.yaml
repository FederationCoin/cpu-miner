# Unsigned Electron miner for a human-created git tag.
# Tag: vMAJOR.MINOR.PATCH-federationcoin.<fork> plus optional .alpha/.beta/.rcN
# (same shape as Sparrow; MAJOR.MINOR.PATCH is package.json version).
# CI does not create tags. Do not dispatch this from the test workflow.
# GH_TOKEN is github.token on gate/draft for gh (same as Sparrow). The pack
# job must not pass it to electron-builder; --publish never so v26 cannot
# auto-create a GitHub Release. private: true refuses npm publish.
# Apple Developer ID / Microsoft Authenticode: not yet provisioned.
name: Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag (vMAJOR.MINOR.PATCH-federationcoin.<fork>, optional .alpha/.beta/.rcN)
        required: true
        type: string

concurrency:
  group: package-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Apple Developer ID / notarization: not yet provisioned. Unsigned only.
  # apple-id: ""
  # team-id: ""
  # MACOS_CERTIFICATE: secrets not yet hosted at https://codesign.federationcoin.org

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require FederationCoin miner tag with no existing Release
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-federationcoin\.[A-Za-z0-9]+(\.(alpha[0-9]*|beta[0-9]*|rc[0-9]+))?$'; then
            echo "tag must match vMAJOR.MINOR.PATCH-federationcoin.<fork> with optional .alpha/.beta/.rcN (got: ${TAG})" >&2
            echo "example: v0.0.0-federationcoin.0 or v0.0.0-federationcoin.0.rc1" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists for ${TAG}; will not overwrite" >&2
            exit 1
          fi
          echo "tag ${TAG} is present and has no GitHub Release"

  build:
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            eb: linux
            artifact: linux-x64
          - os: ubuntu-22.04-arm
            eb: linux
            artifact: linux-arm64
          - os: windows-2022
            eb: win
            artifact: win-x64
          - os: macos-14
            eb: mac
            artifact: macos-arm64
          - os: macos-15-intel
            eb: mac
            artifact: macos-x64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: node -v && npm -v
      - name: Native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ make python3 python3-setuptools
      - name: Native toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python --version
          # npm 11 rejects `npm config set msvs_version`; node-gyp still honors this.
          echo "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Native GPU hasher (Electron ABI)
        env:
          FC_GPU_REQUIRED: '1'
        run: npm run build:gpu
      - name: Require gpu-hasher.node
        shell: bash
        run: test -s native/gpu-hasher/dist/gpu-hasher.node
      # Do not give this job GH_TOKEN (Sparrow does not either). electron-builder
      # v26 still implicit-publishes on GITHUB_ACTIONS and would upload a Release
      # if a token were present. --publish never: pack only. Draft is the gh job.
      - name: Unsigned electron-builder
        shell: bash
        env:
          GH_TOKEN: ''
        run: |
          set -euo pipefail
          npm run build:app
          npx --no-install electron-builder --${{ matrix.eb }} --publish never
      # Unsigned only. Do not inherit Electron's icon into git.
      # Future action: https://codesign.federationcoin.org
      # - name: Codesign
      #   if: false
      #   uses: https://codesign.federationcoin.org
      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in dist-electron/*.AppImage dist-electron/*.exe dist-electron/*.zip; do
            cp -a "$f" dist/
          done
          ls -la dist/
          test -n "$(ls -A dist)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  checksums:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.AppImage' -o -name '*.exe' -o -name '*.zip' \) | LC_ALL=C sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release binaries found in any artifact" >&2
            exit 1
          fi
          duplicates=$(printf '%s\n' "${files[@]##*/}" | LC_ALL=C sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "The same filename appears in more than one artifact:" >&2
            echo "$duplicates" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done | LC_ALL=C sort -k 2 > SHA256SUMS
          echo "$(wc -l < SHA256SUMS) entries"
          cat SHA256SUMS
      - name: Verify the manifest covers every platform
        run: bash .github/scripts/verify-manifest.sh SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error

  draft:
    needs: checksums
    if: ${{ success() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
      - name: Create draft GitHub Release
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.AppImage' -o -name '*.exe' -o -name '*.zip' -o -name 'SHA256SUMS' \) | LC_ALL=C sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No assets to attach" >&2
            exit 1
          fi
          gh release create "$TAG" --draft --title "$TAG" \
            --notes "unsigned; not a Guix/Sparrow-signed release" \
            "${files[@]}"
