name: CI

on:
  push:
    branches:
      - federationcoin
  pull_request:
    branches:
      - federationcoin

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: node -v && npm -v
      - run: sudo apt-get update && sudo apt-get install -y g++ make
      - run: npm ci
      # Headless: Angular unit-test (jsdom), miner vitest, gpu CPU hash fixtures.
      # Not Electron, not a live block search (test:live-electron is laptop-only).
      - run: npm test
