<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="webTitle webDesc">
  <title id="webTitle">Web mill</title>
  <desc id="webDesc">Browser loads the CloudFront SPA, then speaks WSS Stratum to a pool or local gateway. Only the gateway speaks DATUM to Prime.</desc>
  <rect width="720" height="280" fill="#0a0a0a"/>
  <rect x="24" y="40" width="140" height="56" rx="8" fill="#1a1204" stroke="#c9a227"/>
  <text x="94" y="74" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="14">Browser</text>
  <rect x="220" y="40" width="160" height="56" rx="8" fill="#1a1204" stroke="#c9a227"/>
  <text x="300" y="74" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="14">CloudFront SPA</text>
  <rect x="460" y="40" width="236" height="56" rx="8" fill="#1a1204" stroke="#c9a227"/>
  <text x="578" y="74" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="14">Pool or local gateway</text>
  <path d="M164 68 H220" stroke="#c9a227" marker-end="url(#a)"/>
  <path d="M380 68 H460" stroke="#c9a227" marker-end="url(#a)"/>
  <text x="192" y="60" fill="#d4c89a" font-family="sans-serif" font-size="11">loads app</text>
  <text x="420" y="60" fill="#d4c89a" font-family="sans-serif" font-size="11">WSS /stratum</text>
  <rect x="220" y="160" width="160" height="48" rx="8" fill="#1a1204" stroke="#b71c2c"/>
  <text x="300" y="190" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="13">DATUM Gateway</text>
  <rect x="460" y="148" width="110" height="48" rx="8" fill="#1a1204" stroke="#c9a227"/>
  <text x="515" y="178" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="13">Node</text>
  <rect x="590" y="148" width="110" height="48" rx="8" fill="#1a1204" stroke="#b71c2c"/>
  <text x="645" y="178" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="13">Prime</text>
  <path d="M578 96 V148" stroke="#8a7318" stroke-dasharray="4 3"/>
  <path d="M380 184 H460" stroke="#c9a227" marker-end="url(#a)"/>
  <path d="M570 172 H590" stroke="#b71c2c" marker-end="url(#a)"/>
  <text x="24" y="248" fill="#d4c89a" font-family="sans-serif" font-size="12">Hasher never speaks DATUM. Localhost needs Apps On Device.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c9a227"/>
    </marker>
  </defs>
</svg>
