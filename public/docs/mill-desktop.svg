<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="deskTitle deskDesc">
  <title id="deskTitle">Desktop mill</title>
  <desc id="deskDesc">Electron mill speaks TCP Stratum to a pool or a DATUM Gateway, or RPC to a node. The gateway talks GBT to the node and DATUM to Prime. The hasher never speaks DATUM.</desc>
  <rect width="720" height="280" fill="#0a0a0a"/>
  <rect x="24" y="88" width="168" height="80" rx="8" fill="#1a1204" stroke="#c9a227"/>
  <text x="108" y="122" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="15">Electron mill</text>
  <text x="108" y="144" text-anchor="middle" fill="#c9a227" font-family="sans-serif" font-size="12">app</text>
  <rect x="260" y="20" width="180" height="48" rx="8" fill="#1a1204" stroke="#c9a227"/>
  <text x="350" y="50" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="14">Stratum pool</text>
  <rect x="260" y="108" width="180" height="48" rx="8" fill="#1a1204" stroke="#b71c2c"/>
  <text x="350" y="138" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="14">DATUM Gateway</text>
  <rect x="260" y="216" width="180" height="44" rx="8" fill="#1a1204" stroke="#c9a227"/>
  <text x="350" y="244" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="14">Node</text>
  <rect x="512" y="108" width="184" height="48" rx="8" fill="#1a1204" stroke="#b71c2c"/>
  <text x="604" y="138" text-anchor="middle" fill="#f4e9c8" font-family="sans-serif" font-size="14">Prime</text>
  <path d="M192 108 L260 44" stroke="#c9a227" marker-end="url(#gold)"/>
  <text x="198" y="62" fill="#d4c89a" font-family="sans-serif" font-size="11">TCP Stratum</text>
  <path d="M192 128 H260" stroke="#c9a227" marker-end="url(#gold)"/>
  <text x="198" y="120" fill="#d4c89a" font-family="sans-serif" font-size="11">TCP Stratum</text>
  <path d="M192 160 L260 238" stroke="#c9a227" marker-end="url(#gold)"/>
  <text x="198" y="210" fill="#d4c89a" font-family="sans-serif" font-size="11">RPC</text>
  <path d="M440 132 H512" stroke="#b71c2c" marker-end="url(#crimson)"/>
  <text x="452" y="122" fill="#d4c89a" font-family="sans-serif" font-size="11">DATUM</text>
  <path d="M350 156 V216" stroke="#c9a227" marker-end="url(#gold)"/>
  <text x="358" y="190" fill="#d4c89a" font-family="sans-serif" font-size="11">GBT</text>
  <text x="24" y="272" fill="#d4c89a" font-family="sans-serif" font-size="12">No WSS required. Host a pool stays Prime spawn.</text>
  <defs>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c9a227"/>
    </marker>
    <marker id="crimson" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b71c2c"/>
    </marker>
  </defs>
</svg>
