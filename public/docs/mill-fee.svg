<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="feeTitle feeDesc">
  <title id="feeTitle">Fee after the subsidy</title>
  <desc id="feeDesc">The subsidy falls in steps toward zero. The minimum fee stays at floor(vsize / 12). Proof of work stays.</desc>
  <rect width="720" height="300" fill="#0e1824"/>
  <rect x="48" y="48" width="180" height="72" rx="8" fill="#15202e" stroke="#c9a85a"/>
  <text x="138" y="78" text-anchor="middle" fill="#e8e4d9" font-family="sans-serif" font-size="14">Subsidy halves</text>
  <text x="138" y="98" text-anchor="middle" fill="#c9a85a" font-family="sans-serif" font-size="12">new coins toward zero</text>
  <rect x="270" y="48" width="180" height="72" rx="8" fill="#15202e" stroke="#c9a85a"/>
  <text x="360" y="78" text-anchor="middle" fill="#e8e4d9" font-family="sans-serif" font-size="14">Minimum fee</text>
  <text x="360" y="98" text-anchor="middle" fill="#c9a85a" font-family="sans-serif" font-size="12">floor(vsize / 12)</text>
  <rect x="492" y="48" width="180" height="72" rx="8" fill="#15202e" stroke="#c9a85a"/>
  <text x="582" y="78" text-anchor="middle" fill="#e8e4d9" font-family="sans-serif" font-size="14">Proof of work</text>
  <text x="582" y="98" text-anchor="middle" fill="#c9a85a" font-family="sans-serif" font-size="12">stays</text>
  <path d="M228 84 H270" stroke="#c9a85a" marker-end="url(#gold)"/>
  <path d="M450 84 H492" stroke="#c9a85a" marker-end="url(#gold)"/>
  <polyline points="80,220 160,200 240,200 320,170 400,170 480,140 560,140 640,120" fill="none" stroke="#8aa0b4" stroke-width="2"/>
  <line x1="80" y1="160" x2="640" y2="160" stroke="#c9a85a" stroke-width="2"/>
  <text x="48" y="260" fill="#c4bfb0" font-family="sans-serif" font-size="13">The gray steps are the subsidy. The gold line is the fee.</text>
  <text x="48" y="280" fill="#c4bfb0" font-family="sans-serif" font-size="13">It does not move. Miners do not work for free.</text>
  <defs>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#c9a85a"/>
    </marker>
  </defs>
</svg>
