<main>
  <mat-toolbar class="mill-bar">
    <img class="seal" src="federation-seal.png" width="40" height="40" alt="" />
    <span class="brand">GFCN</span>
    <h1>FederationCoin mill</h1>
    <span class="spacer"></span>
    <mat-form-field class="network-toggle" appearance="outline" subscriptSizing="dynamic">
      <mat-label>Network</mat-label>
      <mat-select
        id="network-toggle"
        [value]="network.chain()"
        (selectionChange)="selectNetwork($event.value)"
      >
        <mat-option value="testnet">Testnet</mat-option>
        <mat-option value="main">Main</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-toolbar>
  <p class="lead">
    Mine in this tab. The hasher speaks Stratum over WebSocket to a pool or your local
    gateway. Pool Finder fills a pool URL. Hashrate is your computer. Localhost gateway
    needs Apps On Device.
  </p>

  <app-network-workspace chain="testnet" [hidden]="network.chain() !== 'testnet'" />
  <app-network-workspace chain="main" [hidden]="network.chain() !== 'main'" />

  <app-miner-footer />

  @if (mining.toast()) {
    <div
      class="toast"
      [class.toast-ok]="mining.toastKind() === 'ok'"
      [class.toast-error]="mining.toastKind() !== 'ok'"
      role="status"
    >
      {{ mining.toast() }}
    </div>
  }
</main>
